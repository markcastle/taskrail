[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/store-sqlite", "crates/connector-api", "crates/connector-mcp", "crates/sync", "crates/llm", "src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/markcastle/taskrail"
rust-version = "1.80"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
