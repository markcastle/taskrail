[package]
name = "taskrail-app"
description = "The Task Rail desktop shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "taskrail_app"
path = "src/lib.rs"

[[bin]]
name = "taskrail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
taskrail-core = { path = "../crates/core" }
taskrail-platform = { path = "../crates/platform" }
taskrail-store-sqlite = { path = "../crates/store-sqlite" }
