[package]
name = "taskrail-connector-mcp"
description = "Task Rail's generic connector: any MCP server, described by a saved Connector Profile."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "taskrail-fake-mcp-server"
path = "src/bin/fake_server.rs"

[dependencies]
async-trait = "0.1"
chrono = { workspace = true }
rmcp = { version = "3", default-features = false, features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "reqwest",
    "server",
    "macros",
    "transport-io",
    "auth",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_json_path = "0.7"
taskrail-connector-api = { path = "../connector-api" }
taskrail-core = { path = "../core" }
taskrail-llm = { path = "../llm" }
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-std", "sync"] }

[dev-dependencies]
async-trait = "0.1"
