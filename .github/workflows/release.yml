name: Release

# Pushing a tag such as v0.1.0 builds the installers and publishes a GitHub
# Release carrying them. install.ps1 and install.sh fetch "latest" from there.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Tag matches the app version
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare the tag with tauri.conf.json
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "push" ] && [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match tauri.conf.json version $version. Run: npm run release -- $tag"
            exit 1
          fi
          echo "Building Task Rail $version"
      # What changed since the last release, one line per change, from the
      # commit headlines. This is what the app shows when it offers the update,
      # so it is written for the person using the app, not for GitHub.
      - name: Write the release notes
        id: notes
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..${GITHUB_REF_NAME}"; else range="${GITHUB_REF_NAME}"; fi
          notes=$(git log "$range" --no-merges --pretty=format:'- %s' | grep -v -- '- Release v' | grep -v -i -- '- Merge ' || true)
          if [ -z "$notes" ]; then notes="- Small fixes and improvements."; fi
          {
            echo "notes<<EOF"
            echo "$notes"
            echo ""
            echo "Download below, or install and update in one line from https://taskrail.uk"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$notes"

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
          - name: macOS universal
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs each build so the app only ever installs an update we made.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: 'Task Rail ${{ github.ref_name }}'
          releaseBody: ${{ needs.check.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
