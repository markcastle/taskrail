name: Release

# Two ways in.
#
# The button: Actions → Release → Run workflow, press Run. Leave the version
# blank and the changelog decides it: a minor release if anything is listed
# as Added or Removed under Unreleased, otherwise a patch. Type one to choose
# yourself. This workflow then dates the changelog, sets the version,
# commits, tags, builds the installers and publishes the GitHub Release. Only people with
# write access to the repository can press it. Tick "Rehearse" to see what
# it would do without pushing, building or publishing anything.
#
# The terminal: npm run release -- x.y.z and a tag push, which lands here at
# the build step with the commit and tag already made.
#
# The Roll back workflow calls this one for the roll-forward release.
#
# The build runs in this same workflow rather than off the tag push, because
# a tag pushed with the workflow's own token does not start other workflows.
#
# The release itself is created as a draft before the builds start and
# published after both have uploaded. Two reasons. "latest" never points at a
# release with no installers on it. And the workflow token may only create a
# release for a commit that matches the head of main in its workflow files,
# so the release is created the moment the tag is fresh, not fifteen minutes
# later when main may have moved on (that is how 0.8.1 failed).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Leave blank and the changelog decides: minor if anything was Added, otherwise a patch. Or type a version, such as 0.12.0, to choose yourself.'
        required: false
        type: string
      dry_run:
        description: 'Rehearse: do everything except push, build and publish'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      skip_ci_check:
        description: 'The tree on main was released before, so CI need not have run on this commit'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

# One release at a time, and never cancel one that has started.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare ${{ inputs.version || (github.event_name == 'push' && github.ref_name) || 'the next version' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # A tag someone pushed by hand: the commit is already cut.
            version="${GITHUB_REF_NAME#v}"
            conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
            if [ "$version" != "$conf" ]; then
              echo "::error::Tag v$version does not match tauri.conf.json version $conf. Run: npm run release -- $version"
              exit 1
            fi
            echo "cut=false" >> "$GITHUB_OUTPUT"
          else
            highest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
            version="$INPUT_VERSION"
            why="as asked"
            if [ -z "$version" ]; then
              # Nobody chose, so the changelog does. The reason comes back on
              # stderr and the number on stdout.
              if ! version=$(node scripts/changelog.mjs next "${highest:-0.0.0}" 2> "$RUNNER_TEMP/reason.txt"); then
                echo "::error::$(cat "$RUNNER_TEMP/reason.txt")"
                exit 1
              fi
              why=$(sed -E 's/^After [^ ]+ comes [^:]+: //; s/\.$//' "$RUNNER_TEMP/reason.txt")
            fi
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::\"$version\" is not a version. Use major.minor.patch, such as 0.9.0."
              exit 1
            fi
            if [ "$GITHUB_REF" != "refs/heads/main" ] && [ "$DRY_RUN" != "true" ]; then
              echo "::error::Releases are cut from main, not from $GITHUB_REF_NAME. Pick main under \"Use workflow from\"."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version already exists."
              exit 1
            fi
            if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)" != "$version" ]; then
              echo "::error::$version is not higher than $highest. Running apps only ever install a higher version, so a release must go up."
              exit 1
            fi
            echo "cut=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing Task Rail $version${why:+ ($why)}"
          # On the run's own page, so the number is there to read without opening a log.
          echo "### Task Rail $version${why:+: $why}" >> "$GITHUB_STEP_SUMMARY"

      # The commit being released must have passed CI. A rehearsal skips this
      # so it can run from any branch; a roll back skips it because the tree
      # it releases was released before.
      - name: CI must be green on this commit
        if: steps.version.outputs.cut == 'true' && !inputs.dry_run && !inputs.skip_ci_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | "\(.status) \(.conclusion)"')
          case "$state" in
            "completed success") echo "CI passed on ${GITHUB_SHA:0:7}." ;;
            "") echo "::error::CI has not run on ${GITHUB_SHA:0:7}. Push a commit to main and wait for CI before releasing."; exit 1 ;;
            "completed "*) echo "::error::CI did not pass on ${GITHUB_SHA:0:7} (${state#completed }). Fix main first."; exit 1 ;;
            *) echo "::error::CI is still running on ${GITHUB_SHA:0:7} ($state). Wait for it, then press Run again."; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.cut == 'true'

      # The same command a person runs in the terminal, so the two routes
      # cannot drift: it dates the changelog, sets the version everywhere,
      # commits and tags. It refuses an empty changelog.
      - name: Cut the release
        if: steps.version.outputs.cut == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run release -- "${{ steps.version.outputs.version }}"
          echo
          git show --stat --format='%h %s' HEAD

      - name: Push the commit and the tag
        if: steps.version.outputs.cut == 'true' && !inputs.dry_run
        run: |
          git push origin HEAD:main
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Rehearsal only
        if: inputs.dry_run
        run: |
          echo "Rehearsal: nothing was pushed, built or published."
          echo "A real run would push the commit above and the tag v${{ steps.version.outputs.version }}, then build and publish."

      # The version's section of CHANGELOG.md is the release body. It is what
      # the app opens from "Release notes" when it offers the update, so it is
      # written for the person using the app. A hand-pushed tag with no
      # section falls back to the commit headlines since the previous release.
      # Written to a file for gh and to an output for tauri-action's fallback.
      - name: Write the release notes
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          notes=$(node scripts/changelog.mjs section "$version")
          if [ -z "$notes" ]; then
            echo "CHANGELOG.md has no section for $version; using the commit headlines instead."
            previous=$(git describe --tags --abbrev=0 "v$version^" 2>/dev/null || true)
            if [ -n "$previous" ]; then range="$previous..v$version"; else range="v$version"; fi
            notes=$(git log "$range" --no-merges --pretty=format:'- %s' | grep -v -- '- Release v' | grep -v -i -- '- Merge ' || true)
          fi
          if [ -z "$notes" ]; then notes="- Small fixes and improvements."; fi
          notes="$notes

          Every version's notes are in [CHANGELOG.md](https://github.com/markcastle/taskrail/blob/main/CHANGELOG.md). Download below, or install and update in one line from https://taskrail.uk"
          printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
          {
            echo "notes<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$notes"

      # A draft, so nothing sees it until the installers are on it. The build
      # jobs find it by tag and upload to it; the publish job opens it.
      - name: Create the release as a draft
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          if gh release view "v$version" --json isDraft >/dev/null 2>&1; then
            echo "Release v$version already exists; the builds will upload to it."
            exit 0
          fi
          if ! gh release create "v$version" --draft --title "Task Rail v$version" --notes-file "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::GitHub refused to create the release. This happens when main has moved on with workflow changes since the tag was made. Create it by hand, published, from a checkout: gh release create v$version --title \"Task Rail v$version\" --notes-file <(node scripts/changelog.mjs section $version) and then re-run the failed jobs."
            exit 1
          fi
          echo "Created draft release v$version."

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ''
          - name: macOS universal
            os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.version }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers and publish the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs each build so the app only ever installs an update we made.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Task Rail v${{ needs.prepare.outputs.version }}'
          releaseBody: ${{ needs.prepare.outputs.notes }}
          # true makes tauri-action look through the release list, which is
          # the only way it finds the draft that prepare made. The publish
          # job opens it once every installer is on it.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Open the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          assets=$(gh release view "v$version" --json assets --jq '.assets | map(.name) | join(", ")')
          echo "Assets on v$version: $assets"
          for needed in setup.exe .dmg latest.json; do
            case "$assets" in
              *"$needed"*) ;;
              *) echo "::error::v$version has no $needed on it, so it stays a draft. Check the build jobs."; exit 1 ;;
            esac
          done
          if ! gh release edit "v$version" --draft=false --latest; then
            echo "::error::Every installer is on the draft but GitHub refused to publish it. Open https://github.com/${GH_REPO}/releases and press Publish release on v$version."
            exit 1
          fi
          echo "Task Rail v$version is published: https://github.com/${GH_REPO}/releases/tag/v$version"
          echo "Running apps will see it within the hour."
